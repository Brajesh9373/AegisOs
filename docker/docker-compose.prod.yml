# ECMS Platform — Production Deployment
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Application images are built from the checked-out repository revision.
# Dependency images remain externally sourced and digest-pinned.

name: ecms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ecms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecms-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecms-network

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecms-network

  falkordb:
    image: ${FALKORDB_IMAGE:?Use a digest-pinned FalkorDB image}
    command: ["--timeout", "120000", "--max-queued-queries", "500", "--resultset-size", "100000"]
    volumes:
      - falkordb_data:/data
    cpus: ${ECMS_FALKORDB_CPU_LIMIT:-1.0}
    mem_limit: ${ECMS_FALKORDB_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecms-network

  qdrant:
    image: ${QDRANT_IMAGE:?Use a digest-pinned Qdrant image}
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecms-network

  minio:
    image: ${MINIO_IMAGE:?Use a digest-pinned MinIO image}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ecms-network

  minio-init:
    image: ${MINIO_MC_IMAGE:?Use a digest-pinned MinIO client image}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/ecms-knowledge-graph
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ecms-network

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Use a digest-pinned Prometheus image}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/knowledge-graph-alerts.yml:/etc/prometheus/knowledge-graph-alerts.yml:ro
      - ./prometheus/connector-ingestion-alerts.yml:/etc/prometheus/connector-ingestion-alerts.yml:ro
    networks:
      - ecms-network

  loki:
    image: ${LOKI_IMAGE:?Use a digest-pinned Loki image}
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - ecms-network

  tempo:
    image: ${TEMPO_IMAGE:?Use a digest-pinned Tempo image}
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - ecms-network

  grafana:
    image: ${GRAFANA_IMAGE:?Use a digest-pinned Grafana image}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ecms-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    volumes:
      - memory_data:/app/memory
      - repos_data:/app/data/repos
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_LOG_LEVEL: INFO
      ECMS_CORS_ALLOW_ORIGINS: ${ECMS_CORS_ALLOW_ORIGINS:?ECMS_CORS_ALLOW_ORIGINS is required}
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
      ECMS_REDIS_URL: redis://redis:6379/0
      ECMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ECMS_FALKORDB_URL: redis://falkordb:6379
      ECMS_S3_ENDPOINT_URL: http://minio:9000
      ECMS_S3_PUBLIC_ENDPOINT_URL: ${ECMS_S3_PUBLIC_ENDPOINT_URL:?A browser-reachable S3 or CDN endpoint is required}
      ECMS_S3_BUCKET: ecms-knowledge-graph
      ECMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ECMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ECMS_CONNECTOR_INGESTION_ENABLED: ${ECMS_CONNECTOR_INGESTION_ENABLED:-true}
      # Safe default: submissions continue to use the qualified single-worker
      # path until parallel ingestion is explicitly enabled after rollout gates.
      ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED: ${ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED:-false}
      ECMS_CONNECTOR_EXTRACTION_WORKER_COUNT: ${ECMS_CONNECTOR_EXTRACTION_WORKER_COUNT:-4}
      ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY: ${ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY:-1}
      ECMS_CONNECTOR_INGESTION_PARTITION_TARGET_FILES: ${ECMS_CONNECTOR_INGESTION_PARTITION_TARGET_FILES:-100}
      ECMS_CONNECTOR_INGESTION_MAX_ACTIVE_PARTITIONS_PER_ORG: ${ECMS_CONNECTOR_INGESTION_MAX_ACTIVE_PARTITIONS_PER_ORG:-8}
      ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG: ${ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG:-10737418240}
      ECMS_KNOWLEDGE_GRAPH_RENDERER: ${ECMS_KNOWLEDGE_GRAPH_RENDERER:-d3}
      ECMS_OTEL_ENDPOINT: http://tempo:4317
      ECMS_MEM0_ENABLED: "true"
      ECMS_MEM0_QDRANT_HOST: qdrant
      ECMS_MEM0_QDRANT_PORT: "6333"
      ECMS_MEM0_QDRANT_PATH: /app/data/mem0_qdrant
      ECMS_MEM0_HOME_PATH: /app/data/mem0_home
      ECMS_LLM_MODEL: deepseek/deepseek-v4-flash
      ECMS_EMBEDDING_MODEL: text-embedding-3-small
      ECMS_EMBEDDING_DIM: "1536"
      COMMAND_CODE_API_KEY: ${COMMAND_CODE_API_KEY}
      ECMS_OPENAI_API_KEY: ${ECMS_OPENAI_API_KEY}
      ECMS_OPENAI_BASE_URL: https://api.commandcode.ai/provider/v1
      ECMS_CATEGORIZE_MODEL: gpt-5.5
      ECMS_CATEGORIZE_API_KEY: ${ECMS_CATEGORIZE_API_KEY}
      ECMS_CATEGORIZE_BASE_URL: https://api.freemodel.dev/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - ecms-network

  knowledge-snapshot-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.visualization.snapshot_worker"]
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_LOG_LEVEL: INFO
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
      ECMS_REDIS_URL: redis://redis:6379/0
      ECMS_FALKORDB_URL: redis://falkordb:6379
      ECMS_S3_ENDPOINT_URL: http://minio:9000
      ECMS_S3_PUBLIC_ENDPOINT_URL: ${ECMS_S3_PUBLIC_ENDPOINT_URL:?A browser-reachable S3 or CDN endpoint is required}
      ECMS_S3_BUCKET: ecms-knowledge-graph
      ECMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ECMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ecms.visualization.worker_health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ecms-network

  connector-ingestion-init:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /workspace/connector-ingestions && chown -R 1000:1000 /workspace/connector-ingestions"
    volumes:
      - connector_ingestion_data:/workspace/connector-ingestions
    restart: "no"

  connector-ingestion-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.connectors.ingestion.parent_dispatcher"]
    volumes:
      - connector_ingestion_data:/workspace/connector-ingestions
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_LOG_LEVEL: INFO
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
      ECMS_REDIS_URL: redis://redis:6379/0
      ECMS_FALKORDB_URL: redis://falkordb:6379
      ECMS_S3_ENDPOINT_URL: http://minio:9000
      ECMS_S3_PUBLIC_ENDPOINT_URL: ${ECMS_S3_PUBLIC_ENDPOINT_URL:?A browser-reachable S3 or CDN endpoint is required}
      ECMS_S3_BUCKET: ecms-knowledge-graph
      ECMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ECMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ECMS_CONNECTOR_INGESTION_WORKSPACE: /workspace/connector-ingestions
      ECMS_CONNECTOR_INGESTION_ENABLED: ${ECMS_CONNECTOR_INGESTION_ENABLED:-true}
      ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED: ${ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED:-false}
      ECMS_CONNECTOR_EXTRACTION_WORKER_COUNT: ${ECMS_CONNECTOR_EXTRACTION_WORKER_COUNT:-4}
      ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY: ${ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY:-1}
      ECMS_CONNECTOR_INGESTION_PARTITION_TARGET_FILES: ${ECMS_CONNECTOR_INGESTION_PARTITION_TARGET_FILES:-100}
      ECMS_CONNECTOR_INGESTION_MAX_ACTIVE_PARTITIONS_PER_ORG: ${ECMS_CONNECTOR_INGESTION_MAX_ACTIVE_PARTITIONS_PER_ORG:-8}
      ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG: ${ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG:-10737418240}
      ECMS_CONNECTOR_INGESTION_MAX_BATCH_ENCODED_BYTES: ${ECMS_CONNECTOR_INGESTION_MAX_BATCH_ENCODED_BYTES:-4194304}
      ECMS_CONNECTOR_WORKER_ROLE: parent
      ECMS_CONNECTOR_INGESTION_CHUNK_SIZE: ${ECMS_CONNECTOR_INGESTION_CHUNK_SIZE:-10}
      ECMS_CONNECTOR_INGESTION_WRITE_YIELD_SECONDS: ${ECMS_CONNECTOR_INGESTION_WRITE_YIELD_SECONDS:-0.1}
      ECMS_CONNECTOR_INGESTION_MAX_FILES: ${ECMS_CONNECTOR_INGESTION_MAX_FILES:-250000}
      ECMS_CONNECTOR_INGESTION_MAX_FILE_BYTES: ${ECMS_CONNECTOR_INGESTION_MAX_FILE_BYTES:-2097152}
      ECMS_CONNECTOR_INGESTION_MAX_TOTAL_BYTES: ${ECMS_CONNECTOR_INGESTION_MAX_TOTAL_BYTES:-2147483648}
      ECMS_CONNECTOR_GIT_CLONE_DEPTH: ${ECMS_CONNECTOR_GIT_CLONE_DEPTH:-50}
      ECMS_CONNECTOR_GIT_CLONE_TIMEOUT_SECONDS: ${ECMS_CONNECTOR_GIT_CLONE_TIMEOUT_SECONDS:-600}
      ECMS_CONNECTOR_GIT_FETCH_TIMEOUT_SECONDS: ${ECMS_CONNECTOR_GIT_FETCH_TIMEOUT_SECONDS:-300}
    depends_on:
      connector-ingestion-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ecms.connectors.ingestion.parallel_health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    cpus: ${ECMS_CONNECTOR_INGESTION_CPU_LIMIT:-0.75}
    mem_limit: ${ECMS_CONNECTOR_INGESTION_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - ecms-network

  connector-ingestion-extractor:
    profiles: ["parallel-ingestion"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.connectors.ingestion.extraction_process"]
    volumes:
      - connector_ingestion_data:/workspace/connector-ingestions:ro
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_LOG_LEVEL: INFO
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
      ECMS_REDIS_URL: redis://redis:6379/0
      ECMS_S3_ENDPOINT_URL: http://minio:9000
      ECMS_S3_BUCKET: ecms-knowledge-graph
      ECMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ECMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ECMS_CONNECTOR_INGESTION_WORKSPACE: /workspace/connector-ingestions
      ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED: ${ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED:-false}
      ECMS_CONNECTOR_INGESTION_CHUNK_SIZE: ${ECMS_CONNECTOR_INGESTION_CHUNK_SIZE:-10}
      ECMS_CONNECTOR_INGESTION_MAX_BATCH_ENCODED_BYTES: ${ECMS_CONNECTOR_INGESTION_MAX_BATCH_ENCODED_BYTES:-4194304}
      ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG: ${ECMS_CONNECTOR_INGESTION_MAX_STAGED_BYTES_PER_ORG:-10737418240}
      ECMS_CONNECTOR_WORKER_ROLE: extractor
    depends_on:
      connector-ingestion-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ecms.connectors.ingestion.parallel_health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    cpus: ${ECMS_CONNECTOR_EXTRACTION_CPU_LIMIT:-0.75}
    mem_limit: ${ECMS_CONNECTOR_EXTRACTION_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - ecms-network

  connector-ingestion-graph-writer:
    profiles: ["parallel-ingestion"]
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.connectors.ingestion.graph_writer_process"]
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_LOG_LEVEL: INFO
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
      ECMS_REDIS_URL: redis://redis:6379/0
      ECMS_FALKORDB_URL: redis://falkordb:6379
      ECMS_S3_ENDPOINT_URL: http://minio:9000
      ECMS_S3_BUCKET: ecms-knowledge-graph
      ECMS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      ECMS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED: ${ECMS_CONNECTOR_PARALLEL_INGESTION_ENABLED:-false}
      ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY: ${ECMS_CONNECTOR_GRAPH_WRITER_CONCURRENCY:-1}
      ECMS_CONNECTOR_WORKER_ROLE: graph-writer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ecms.connectors.ingestion.parallel_health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    cpus: ${ECMS_CONNECTOR_GRAPH_WRITER_CPU_LIMIT:-0.5}
    mem_limit: ${ECMS_CONNECTOR_GRAPH_WRITER_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - ecms-network

  worker-knowledge:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.cli.app", "worker", "knowledge"]
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ECMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ecms}
    depends_on:
      - kafka
      - backend
    networks:
      - ecms-network

  worker-reflection:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.cli.app", "worker", "reflection"]
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
      - backend
    networks:
      - ecms-network

  worker-promotion:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "ecms.cli.app", "worker", "promotion"]
    environment:
      ECMS_ENVIRONMENT: production
      ECMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
      - backend
    networks:
      - ecms-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecms-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  falkordb_data:
  qdrant_data:
  minio_data:
  memory_data:
  repos_data:
  connector_ingestion_data:

networks:
  ecms-network:
    driver: bridge
