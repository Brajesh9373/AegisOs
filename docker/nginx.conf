resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;

upstream ecms_backend {
    zone ecms_backend 64k;
    server backend:8000 resolve;
}

upstream snapshot_store {
    zone snapshot_store 64k;
    server minio:9000 resolve;
}

proxy_cache_path /var/cache/nginx/knowledge-graph
    levels=1:2
    keys_zone=knowledge_graph_artifacts:32m
    max_size=2g
    inactive=1h
    use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Same-origin cache for short-lived signed immutable Arrow artifacts.
    # Production may point ECMS_S3_PUBLIC_ENDPOINT_URL at an external CDN.
    location /ecms-knowledge-graph/ {
        proxy_pass http://snapshot_store;
        proxy_set_header Host $http_host;
        proxy_cache knowledge_graph_artifacts;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_valid 200 206 5m;
        proxy_cache_valid 404 10s;
        proxy_ignore_headers Set-Cookie;
        add_header X-Graph-Artifact-Cache $upstream_cache_status always;
        proxy_read_timeout 60s;
    }

    location /queue {
        proxy_pass http://ecms_backend/api/queue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /organization/ {
        proxy_pass http://ecms_backend/organization/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /agents {
        proxy_pass http://ecms_backend/agents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /categories {
        proxy_pass http://ecms_backend/categories;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /projects/new {
        try_files $uri /index.html;
    }

    location /projects {
        proxy_pass http://ecms_backend/projects;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Proxy /api requests to the backend (supports SSE streaming)
    location /api/ {
        proxy_pass http://ecms_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Proxy legacy graph and provider endpoints
    location /legacy-graph/ {
        proxy_pass http://ecms_backend/legacy-graph/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /providers/ {
        proxy_pass http://ecms_backend/providers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Proxy /health to backend
    location /health {
        proxy_pass http://ecms_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://ecms_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Proxy GraphQL
    location /graphql {
        proxy_pass http://ecms_backend/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
