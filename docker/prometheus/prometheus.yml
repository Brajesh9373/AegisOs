global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/knowledge-graph-alerts.yml
  - /etc/prometheus/connector-ingestion-alerts.yml

scrape_configs:
  - job_name: ecms-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
