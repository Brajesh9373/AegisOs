services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aegisOS-api
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://ecms:ecms@postgres:5432/ecms
      # ECMS Python backend (discovery, hierarchy, workspace). Resolved over
      # the shared ecms network (see networks below); override per deployment.
      ECMS_BACKEND_URL: ${ECMS_BACKEND_URL:-http://backend:8000}
      ECMS_SERVICE_TOKEN: ${ECMS_SERVICE_TOKEN:-}
    networks:
      - default
      - ecms-network
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aegisOS-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api:3001
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5173']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  # Shared with the root ECMS stack (docker/docker-compose.yml, project name
  # "ecms") so the BFF reaches postgres and the Python backend over service
  # DNS instead of host-gateway hacks. Must exist: start the backend stack first.
  ecms-network:
    name: ecms_ecms-network
    external: true
