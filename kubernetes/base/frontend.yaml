apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecms-frontend
  namespace: ecms
  labels:
    app.kubernetes.io/name: ecms
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ecms
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecms
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ecms-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecms-frontend
  namespace: ecms
  labels:
    app.kubernetes.io/name: ecms
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: ecms
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
