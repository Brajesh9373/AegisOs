{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecms
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecms.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ecms-backend
                port:
                  number: 80
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: ecms-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecms-frontend
                port:
                  number: 80
{{- end }}
