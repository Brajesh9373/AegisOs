[project]
name = "ecms-kgraph"
version = "0.1.0"
description = "Enterprise Cognitive Memory System foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "graphiti-core[falkordb]<1",  # optional — raw keyword mode works without it
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pymysql>=1.1.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_ecms"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
